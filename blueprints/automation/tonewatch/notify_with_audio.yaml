blueprint:
  name: ToneWatch - notify with dispatch audio
  description: Send a mobile notification with a ToneWatch recording. iOS receives an audio attachment; Android receives a link because the Android companion notification attachment does not support arbitrary audio files.
  domain: automation
  source_url: https://github.com/JustBeanie/ha-tonewatch/blob/main/blueprints/automation/tonewatch/notify_with_audio.yaml
  homeassistant:
    min_version: "2026.2.0"
  input:
    tone_set_event:
      name: Tone set event entity
      description: The ToneWatch event entity for the tone set to monitor.
      selector:
        entity:
          domain: event
          integration: tonewatch
    notify_service:
      name: Mobile notify service
      description: The notify.mobile_app service to call.
      selector:
        text:
    notification_title:
      name: Notification title
      description: Title shown on the phone.
      default: ToneWatch recording ready
      selector:
        text:
trigger:
  - platform: state
    entity_id: !input tone_set_event
condition:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none
         and trigger.to_state.attributes.get('event_type') == 'recording_ready'
         and trigger.to_state.attributes.get('recording_proxy_url') }}
action:
  - action: !input notify_service
    data:
      title: !input notification_title
      message: ToneWatch recording ready. Tap to open the audio.
      data:
        url: "{{ trigger.to_state.attributes.recording_proxy_url }}"
        clickAction: "{{ trigger.to_state.attributes.recording_proxy_url }}"
        attachment:
          url: "{{ trigger.to_state.attributes.recording_proxy_url }}"
          content-type: "{{ 'audio/ogg' if trigger.to_state.attributes.get('format') in ['ogg', 'opus'] else 'audio/mpeg' }}"
mode: queued
max: 10

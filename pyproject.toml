[project]
name = "ha-tonewatch"
version = "0.3.0"
description = "Home Assistant custom integration for ToneWatch"
requires-python = ">=3.14.2,<3.15"
dependencies = [
  "homeassistant==2026.11.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-homeassistant==2026.11.2",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"  # shipped code must still run on HA 2026.2 (Python 3.13)

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF", "S", "ASYNC", "PL", "PERF", "FURB", "TRY", "RET", "ARG", "ERA", "TC", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D"]
"custom_components/tonewatch/*.py" = ["D", "PLR", "TRY003", "TRY301", "ASYNC240", "B008", "ARG", "PTH", "TC001", "TC002", "TC003"]

[tool.mypy]
strict = true
mypy_path = "."
plugins = []

[[tool.mypy.overrides]]
module = ["homeassistant.*", "aiohttp.*", "voluptuous.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-p no:respx --strict-markers --allow-unix-socket --cov=custom_components/tonewatch --cov-fail-under=90 --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  # Upstream import-time deprecations from HA 2026.11's own dependency chain.
  "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning",
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["allow_unregistered: test config flow without registering a real integration"]
